    <meta charset="utf-8" />

    <!-- Favicon: prefer repo-relative so GitHub Pages works -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <style>
      :root { --primary-loading-background: #000000; }
      body { background: var(--primary-loading-background); margin: 0; }
      body, #root { min-height: 100vh; min-height: 100dvh; }

      .js-loader { position: fixed; inset: 0; display: grid; place-items: center; background-color: transparent; z-index: 1; pointer-events: none; transition: opacity 0.3s ease-out; }
      .js-loader.hidden { opacity: 0; }
      .js-loader img { height: auto; }

      /* basic fallback link styling */
      .fallback a { color: #9cf; text-decoration: underline; }
    </style>

    <script>
      // Resolve asset path relative to current document so GitHub Pages and local servers both work
      (function(){
        var asset = 'assets/index-ejUyHDKr.js';
        // If the asset is missing, show a helpful message instead of a stuck loader
        function showMissing() {
          document.addEventListener('DOMContentLoaded', function(){
            var loader = document.getElementById('jsLoader'); if(loader) loader.classList.add('hidden');
            var root = document.getElementById('root');
            if(root) root.innerHTML = '<div class="fallback" style="color:white;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;flex-direction:column"><div style="font-size:18px;margin-bottom:8px">App assets are missing.</div><div style="font-size:14px;margin-bottom:12px">Build and publish the /assets directory or place your bundle at assets/index-ejUyHDKr.js.</div><div><a href="https://github.com/shadowtrimz/adsdasda" target="_blank" rel="noopener">Open repository</a></div></div>';
          });
        }

        try {
          fetch(asset, { method: 'HEAD' }).then(function(res){ if(!res.ok) showMissing(); }).catch(function(){ /* network error: ignore; app may still work */ });
        } catch(e){ /* ignore */ }
      })();
    </script>

    <!-- Load the bundle (should be built and placed under assets/) -->
    <script type="module" crossorigin src="assets/index-ejUyHDKr.js"></script>

    <div id="jsLoader" class="js-loader">

    </div>
    <main id="root"></main>
  </body>
