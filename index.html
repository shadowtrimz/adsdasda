      }

      .lds-facebook {
        background-color: transparent;
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
      }
      .lds-facebook div {
        display: inline-block;
        position: absolute;
        left: 8px;
        width: 16px;
        background: #fff;
        animation: lds-facebook 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
      }
      .lds-facebook div:nth-child(1) {
        left: 8px;
        animation-delay: -0.24s;
      }
      .lds-facebook div:nth-child(2) {
        left: 32px;
        animation-delay: -0.12s;
      }
      .lds-facebook div:nth-child(3) {
        left: 56px;
        animation-delay: 0;
      }
      @keyframes lds-facebook {
        0% {
          top: 8px;
          height: 64px;
        }
        50%,
        100% {
          top: 24px;
          height: 32px;
        }
      }

      .js-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background-color: transparent;
        z-index: 1;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }

      .js-loader.hidden {
        opacity: 0;
      }

      .js-loader img {
        height: auto;
      }

      /* basic fallback link styling */
      .fallback a { color: #9cf; text-decoration: underline; }
